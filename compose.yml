services:
  homeassistant:
    container_name: home-assistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - /opt/figgy/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    stop_grace_period: 60s
    privileged: true
    network_mode: host
    environment:
      TZ: America/Los_Angeles

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    volumes:
      - /opt/figgy/jellyfin:/config
      - /srv/media:/media
    ports:
      - 8096:8096
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/figgy/caddy/Caddyfile:/etc/caddy/Caddyfile
      - /opt/figgy/caddy/data:/data
      - /opt/figgy/caddy/config:/config
      - /opt/figgy/landing:/srv/landing:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ha-mcp:
    image: ghcr.io/homeassistant-ai/ha-mcp:latest
    container_name: ha-mcp
    command: ha-mcp-web
    ports:
      - "8086:8086"
    environment:
      - HOMEASSISTANT_URL=http://host.docker.internal:8123
      - HOMEASSISTANT_TOKEN=${HOMEASSISTANT_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ha-mcp-data:/home/mcpuser/.ha-mcp

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/figgy/portainer:/data
    environment:
      - TZ=America/Los_Angeles

volumes:
  ha-mcp-data:
